[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-hgt"
version = "1.0.0"
description = "Relational maze benchmarks and recurrent HGT policies"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "matplotlib>=3.8"]

[project.scripts]
maze-hgt = "maze_hgt.cli:main"

[tool.setuptools.packages.find]
include = ["maze_hgt*"]
